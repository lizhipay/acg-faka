[www]
; 官方镜像的 docker.conf 把 access.log 指到 stderr，和 nginx 的访问日志完全重复，
; docker logs 里每个请求会出现两遍。这里关掉，访问日志只由 nginx 出。
access.log = /dev/null

; 供容器健康检查用：不经过应用代码，只证明 php-fpm 活着
ping.path = /ping
ping.response = pong

; 让 worker 的输出进 supervisord 的管道，否则 PHP 的 warning/fatal 全丢掉
catch_workers_output = yes
decorate_workers_output = no

; 关键：默认 php-fpm 会清空环境变量，容器里注入的 ACG_DB_* 就到不了 PHP。
; 安装向导要靠它自动填好内置数据库的连接信息。
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
