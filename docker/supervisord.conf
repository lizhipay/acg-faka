; php-fpm 和 nginx 同容器运行，由 supervisord 托管。
; 两个进程的日志都直接吐到容器 stdout/stderr，docker logs 一把看全。
[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[program:php-fpm]
command=/usr/local/bin/acg-wait-db php-fpm --nodaemonize --force-stderr
priority=10
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startretries=3
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
