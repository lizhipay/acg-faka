date.timezone = Asia/Shanghai

memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120

; 单一入口 + nginx 只放行 index.php，这里再兜一层
cgi.fix_pathinfo = 0
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; 插件/模板文件多，加大 realpath 缓存能省掉大量 stat
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; 会话后端不在这里写死：单容器裸跑时没有 redis 服务，写死会让 session_start() 直接失败。
; 由 entrypoint 按 ACG_REDIS_HOST 是否存在生成 conf.d/zz-acg-session.ini。
