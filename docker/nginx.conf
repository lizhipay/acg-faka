# acg-faka 官方镜像的 nginx 配置。
# 与 php-fpm 同容器运行，由 supervisord 一起拉起。

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

# 容器默认软限制只有 1024，不抬高的话 worker_connections 会被 nginx 警告并实际打折
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format acg '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout acg;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;
    keepalive_timeout 65;

    # 与 php.ini 的 upload_max_filesize / post_max_size 对齐，否则大文件在 nginx 就被 413 掉
    client_max_body_size 50m;
    client_body_buffer_size 256k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # 反代（Caddy / Traefik / CDN / 宝塔）在前面终止 TLS 时，把真实协议和来访 IP 传进 PHP。
    # 只信任私有网段，公网来的伪造头不生效。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # $_SERVER['HTTPS'] —— Kernel.php 靠它决定 Cookie 的 secure 属性
    map $http_x_forwarded_proto $acg_https {
        default "";
        https   on;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        root /var/www/html;
        index index.php;
        charset utf-8;

        # 健康检查：一次请求同时验证 nginx 和 php-fpm 都活着，
        # 走 php-fpm 内建的 ping 端点，不碰应用代码；不记日志，免得每 15 秒刷屏。
        location = /healthz {
            access_log off;
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME /ping;
            fastcgi_param SCRIPT_FILENAME /ping;
        }

        # ── 单一入口 ────────────────────────────────────────────────
        # 整个程序只有 index.php 一个 web 入口，其余请求全靠 ?s= 路由。
        # 所以这里只放行它一个，其它 .php 一律不执行 —— 上传目录里就算真被塞进
        # 一个 .php，也跑不起来。
        #
        # 判定式和 .htaccess / IIS / 文档里的 nginx 伪静态完全一致，改一处要改四处。
        # 本文件的 location 顺序由我们自己控制，其实用 location ~ \.php$ 就够；
        # 之所以仍写成 server 级 if，是因为它多挡住 PATH_INFO 形式
        # （/app/x.php/y），以后谁再往这里加 location ~ [^/]\.php(/|$) 也拦得住。
        # 用 $uri（已归一化解码）而不是 $request_uri，才能挡住 %70 之类的编码绕过。
        if ($uri ~* "^/(?!index\.php(/|$)).*\.php(/|$)") { return 404; }

        location = /index.php {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $acg_https if_not_empty;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
        }

        # ── 拒绝规则 ────────────────────────────────────────────────
        # 与 .htaccess / IIS / 文档伪静态同一套语义。
        # encryption、tests 是本文件独有的两个额外名字：镜像里通常没有它们，
        # 但开发时若把整个仓库 bind mount 进来就会出现，多挡一层不亏。
        location ~ ^/(config|kernel|runtime|vendor|encryption|tests)(/|$) {
            return 404;
        }
        # 点文件 / 点目录，放行 ACME 证书校验
        location ~ /\.(?!well-known) {
            return 404;
        }
        # 敏感后缀：站点根目录的 runtime.log 就是靠这条挡住的
        location ~* \.(log|sql|sqlite|db|db-wal|db-shm|bak|old|save|orig|swp|swo|tmp|ini|lock)$ {
            return 404;
        }
        # 备份副本与依赖清单
        location ~* (~|composer\.(json|lock)|package(-lock)?\.json)$ {
            return 404;
        }

        # ── 静态资源 ────────────────────────────────────────────────
        location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|mp4|webm|mp3|ogg)$ {
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
            try_files $uri =404;
        }

        # ── 伪静态 ──────────────────────────────────────────────────
        # 等价于仓库里 .htaccess 的 RewriteRule ^(.*)$ index.php?s=/$1 [QSA]
        location / {
            try_files $uri $uri/ /index.php?s=$uri&$args;
        }
    }
}
