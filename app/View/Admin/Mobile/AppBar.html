<header class="admin-mobile-appbar" data-admin-mobile-appbar>
    <div class="admin-mobile-appbar__top">
        <div class="admin-mobile-appbar__heading">
            <strong data-admin-mobile-title>#{$title}</strong>
            <span class="admin-mobile-enterprise-badge" data-admin-mobile-enterprise hidden>#{t("企业版")}</span>
        </div>
        <button type="button" class="admin-mobile-icon-button" data-admin-mobile-appearance aria-label="#{t('外观模式')}" aria-haspopup="dialog" aria-expanded="false" aria-controls="admin-mobile-appearance-sheet">
            <span class="material-icons-outlined" aria-hidden="true">contrast</span>
        </button>
        <a class="admin-mobile-icon-button admin-mobile-store-button" data-admin-mobile-store href="/admin/store/home" aria-label="#{t('应用商店')}">
            <span class="material-icons-outlined" aria-hidden="true">storefront</span>
        </a>
    </div>
    <!-- 全局搜索/筛选入口。renderSearch() 会按当前页改写占位文案、筛选条数徽标，
         以及尾部图标（有页面筛选时是 tune，否则是 apps 打开「全部」导航） -->
    <button type="button" class="admin-mobile-search" data-admin-mobile-search
            aria-haspopup="dialog" aria-expanded="false" aria-controls="admin-mobile-search-sheet"
            aria-label="#{t('搜索后台功能')}">
        <span class="material-icons-outlined admin-mobile-search__lead" aria-hidden="true">search</span>
        <span class="admin-mobile-search__copy" data-admin-mobile-search-placeholder>#{t('搜索后台功能')}</span>
        <span class="admin-mobile-search__count" data-admin-mobile-search-count hidden>0</span>
        <span class="material-icons-outlined admin-mobile-search__trail" data-admin-mobile-search-trail aria-hidden="true">apps</span>
    </button>
</header>
<nav class="admin-mobile-context-tabs" data-admin-mobile-context-tabs aria-label="#{t('当前功能导航')}" hidden></nav>
