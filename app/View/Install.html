<!doctype html>
<html lang="zh-CN" data-theme="light" data-theme-pref="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex, nofollow">
    <title>安装向导 · 异次元发卡</title>
    <script>
        /* 首屏防闪：主题和语言都在 CSS 生效前定下来。
           主题用的 localStorage 键和后台登录页是同一个（admin-theme），装完进后台就是同一套外观。 */
        (function () {
            var root = document.documentElement;
            try {
                var pref = localStorage.getItem('admin-theme') || 'auto';
                if (pref !== 'light' && pref !== 'dark') pref = 'auto';
                var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
                root.setAttribute('data-theme', dark ? 'dark' : 'light');
                root.setAttribute('data-theme-pref', pref);
            } catch (e) {
                root.setAttribute('data-theme', 'light');
            }
            try {
                var tags = {'zh-cn': 'zh-CN', 'zh-tw': 'zh-TW', 'en': 'en', 'ja': 'ja'};
                var l = localStorage.getItem('acg-install-lang');
                if (l && tags[l]) root.setAttribute('lang', tags[l]);
            } catch (e) {}
        })();
    </script>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/assets/common/fonts/material-icons.css">
    <style>
        /* ================================================================
           设计令牌 —— 中性底色 + 单一强调色，不用渐变、不做装饰动画
           ================================================================ */
        :root {
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                    "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            --r-sm: 6px;
            --r: 10px;
            --r-lg: 14px;
            --ease: cubic-bezier(.4, 0, .2, 1);
            --dur: .18s;
        }
        html[lang="zh-TW"] { --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans CJK TC", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
        html[lang="ja"]    { --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans CJK JP", "Segoe UI", Arial, sans-serif; }
        html[lang="en"]    { --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }

        [data-theme="light"] {
            --bg: #f6f6f7;
            --surface: #ffffff;
            --surface-2: #f2f2f4;
            --surface-3: #e7e7ea;
            --text: #18181b;
            --text-2: #5b5b63;
            --text-3: #8e8e98;
            --line: #e5e5e9;
            --line-2: #d3d3d9;
            --accent: #c4426f;
            --accent-2: #a8355d;
            --accent-soft: #fbeaf0;
            --accent-ink: #ffffff;
            --ok: #17804a;      --ok-soft: #e8f5ee;
            --warn: #9a6412;    --warn-soft: #fbf1e0;
            --bad: #c0392f;     --bad-soft: #fbeae8;
            --info: #2f5fb8;    --info-soft: #e9eefa;
            --shadow: 0 1px 2px rgba(24, 24, 27, .05);
            --ring: 0 0 0 3px rgba(196, 66, 111, .18);
            --code-bg: #f2f2f4;
        }
        [data-theme="dark"] {
            --bg: #101012;
            --surface: #18181b;
            --surface-2: #202024;
            --surface-3: #2a2a30;
            --text: #f1f1f3;
            --text-2: #a4a4ad;
            --text-3: #74747f;
            --line: #2a2a30;
            --line-2: #3a3a42;
            --accent: #ee7ba4;
            --accent-2: #f592b3;
            --accent-soft: rgba(238, 123, 164, .12);
            --accent-ink: #2a0c18;
            --ok: #4ec98a;      --ok-soft: rgba(78, 201, 138, .12);
            --warn: #e0a856;    --warn-soft: rgba(224, 168, 86, .12);
            --bad: #f0736c;     --bad-soft: rgba(240, 115, 108, .12);
            --info: #7ea5f0;    --info-soft: rgba(126, 165, 240, .12);
            --shadow: 0 1px 2px rgba(0, 0, 0, .3);
            --ring: 0 0 0 3px rgba(238, 123, 164, .22);
            --code-bg: #202024;
        }

        /* ================================================================
           基础
           ================================================================ */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            font: 15px/1.6 var(--font);
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100dvh;
        }
        button, input { font: inherit; color: inherit; }
        button { cursor: pointer; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        code { font-family: var(--mono); font-size: .92em; }
        .hidden { display: none !important; }
        :focus-visible { outline: none; box-shadow: var(--ring); }
        .mi { font-size: 20px; line-height: 1; vertical-align: middle; user-select: none; }

        /* ================================================================
           顶栏
           ================================================================ */
        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            height: 56px; padding: 0 20px;
            border-bottom: 1px solid var(--line); background: var(--surface);
        }
        .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
        .brand img { width: 22px; height: 22px; border-radius: 5px; flex: none; }
        .brand-name { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chip { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); flex: none; }
        .tools { display: flex; align-items: center; gap: 8px; flex: none; }

        /* 主题三段式 */
        .seg { display: inline-flex; padding: 2px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); }
        .seg button {
            display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 26px;
            border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-3); transition: color var(--dur), background var(--dur);
        }
        .seg button .mi { font-size: 17px; }
        .seg button:hover { color: var(--text); }
        .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

        /* 语言 */
        .lang { position: relative; }
        .lang-btn {
            display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
            border-radius: var(--r); background: transparent; border: 1px solid var(--line); color: var(--text-2); font-size: 13.5px;
            transition: background var(--dur), color var(--dur);
        }
        .lang-btn:hover { background: var(--surface-2); color: var(--text); }
        .lang-btn .mi { font-size: 17px; }
        .lang-menu {
            position: absolute; right: 0; top: calc(100% + 6px); min-width: 160px; padding: 4px;
            background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .12); z-index: 20;
        }
        .lang-menu button {
            display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 7px 9px;
            border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; font-size: 14px;
        }
        .lang-menu button:hover { background: var(--surface-2); }
        .lang-menu button[aria-checked="true"] { color: var(--accent); font-weight: 600; }
        .lang-menu button .mi { font-size: 17px; color: var(--accent); }

        /* ================================================================
           步骤条（横向、极简）
           ================================================================ */
        .steps { list-style: none; display: flex; align-items: center; margin: 0 0 34px; padding: 0; }
        .step { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .step + .step::before {
            content: ""; width: 28px; height: 1px; margin: 0 12px; flex: none;
            background: var(--line-2); transition: background var(--dur);
        }
        .step.done + .step::before, .step.active + .step::before { background: var(--accent); }
        .step-dot {
            width: 22px; height: 22px; border-radius: 50%; flex: none;
            display: grid; place-items: center;
            border: 1px solid var(--line-2); color: var(--text-3);
            font-size: 11.5px; font-weight: 650; font-family: var(--mono);
            transition: all var(--dur) var(--ease);
        }
        .step-dot .mi { font-size: 14px; }
        .step.active .step-dot { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
        .step.done .step-dot { border-color: var(--accent); background: transparent; color: var(--accent); }
        .step-title { font-size: 13.5px; color: var(--text-3); white-space: nowrap; transition: color var(--dur); }
        .step.active .step-title { color: var(--text); font-weight: 600; }
        .step.done .step-title { color: var(--text-2); }
        .step-desc { display: none; }

        /* ================================================================
           内容
           ================================================================ */
        .stage { padding: 40px 20px 64px; }
        .panel { width: 100%; max-width: 620px; margin: 0 auto; }
        .view { animation: enter var(--dur) var(--ease); }
        .view.leaving { animation: leave .14s var(--ease) forwards; }
        @keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes leave { to { opacity: 0; transform: translateY(-4px); } }

        .eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .3px; color: var(--accent); }
        h1 { margin: 8px 0 8px; font-size: 25px; line-height: 1.25; font-weight: 700; letter-spacing: -.2px; }
        .lead { margin: 0 0 26px; color: var(--text-2); font-size: 14.5px; max-width: 58ch; }

        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
        .card + .card { margin-top: 12px; }
        .card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
        .card-h h3 { margin: 0; font-size: 12px; font-weight: 650; letter-spacing: .5px; text-transform: uppercase; color: var(--text-3); }

        /* 横幅 */
        .banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); margin-bottom: 14px; }
        .banner .mi { font-size: 21px; flex: none; margin-top: 1px; color: var(--text-3); }
        .banner b { display: block; font-size: 14.5px; font-weight: 650; }
        .banner p { margin: 3px 0 0; color: var(--text-2); font-size: 13.5px; }
        .banner .aux { margin-left: auto; flex: none; font-size: 12.5px; color: var(--text-3); display: inline-flex; align-items: center; gap: 6px; }
        .banner.ok   { background: var(--ok-soft);   border-color: transparent; }  .banner.ok .mi   { color: var(--ok); }
        .banner.warn { background: var(--warn-soft); border-color: transparent; }  .banner.warn .mi { color: var(--warn); }
        .banner.bad  { background: var(--bad-soft);  border-color: transparent; }  .banner.bad .mi  { color: var(--bad); }
        .banner.info { background: var(--info-soft); border-color: transparent; }  .banner.info .mi { color: var(--info); }

        /* 检查项 */
        .rows { padding: 4px 8px; }
        .row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; }
        .row + .row { border-top: 1px solid var(--line); }
        .row .ico { color: var(--text-3); flex: none; display: grid; place-items: center; }
        .row .ico .mi { font-size: 19px; }
        .row .name { font-weight: 600; font-size: 14px; }
        .row .sub { font-size: 12.5px; color: var(--text-3); }
        .row .grow { flex: 1; min-width: 0; }
        .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
        .pill .mi { font-size: 15px; }
        .pill.ok { color: var(--ok); }
        .pill.bad { color: var(--bad); }

        .ext-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
        .ext {
            display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px;
            border: 1px solid var(--line); border-radius: var(--r-sm);
            background: var(--surface); font-family: var(--mono); font-size: 12.5px;
        }
        .ext .mi { font-size: 16px; color: var(--ok); }
        .ext.bad { color: var(--bad); }
        .ext.bad .mi { color: var(--bad); }

        /* 修复指引 */
        .fix { margin-top: 12px; }
        .fix-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
        .fix-item b { display: block; font-size: 14px; margin-bottom: 6px; }
        .fix-item p { margin: 4px 0; color: var(--text-2); font-size: 13.5px; }
        .cmd {
            position: relative; display: flex; align-items: center; gap: 10px; margin: 8px 0 0; padding: 9px 40px 9px 12px;
            border-radius: var(--r-sm); background: var(--code-bg);
            font-family: var(--mono); font-size: 12.5px; color: var(--text); overflow-x: auto; white-space: nowrap;
        }
        .cmd .k { color: var(--text-3); flex: none; font-family: var(--font); font-size: 12px; }
        .cmd .copy {
            position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border: 0; border-radius: var(--r-sm);
            background: transparent; color: var(--text-3); display: grid; place-items: center;
        }
        .cmd .copy:hover { background: var(--surface-3); color: var(--text); }
        .cmd .copy .mi { font-size: 16px; }

        /* 表单 */
        .form { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px 12px; }
        .field { grid-column: span 6; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
        .field.c4 { grid-column: span 4; }
        .field.c3 { grid-column: span 3; }
        .field.c2 { grid-column: span 2; }
        .label { display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--text-2); }
        .label .opt { font-weight: 400; color: var(--text-3); font-size: 12px; }
        .control { position: relative; display: flex; align-items: center; }
        .control .mi.lead-ico { display: none; }
        .input {
            width: 100%; height: 42px; padding: 0 13px; border-radius: var(--r); border: 1px solid var(--line-2);
            background: var(--surface); color: var(--text); transition: border-color var(--dur), box-shadow var(--dur);
            outline: none; -webkit-appearance: none; appearance: none;
        }
        .input::placeholder { color: var(--text-3); }
        .input:hover { border-color: var(--text-3); }
        .input:focus { border-color: var(--accent); box-shadow: var(--ring); }
        .control.has-tail .input { padding-right: 42px; }
        .tail { position: absolute; right: 5px; width: 30px; height: 30px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-3); display: grid; place-items: center; }
        .tail:hover { background: var(--surface-2); color: var(--text); }
        .tail .mi { font-size: 18px; }
        .help { font-size: 12.5px; color: var(--text-3); }
        .field.invalid .input { border-color: var(--bad); }
        .field.invalid .input:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 16%, transparent); }
        .field.invalid .help { color: var(--bad); }

        /* 密码强度 */
        .meter { display: flex; gap: 3px; margin-top: 3px; }
        .meter i { flex: 1; height: 3px; border-radius: 3px; background: var(--surface-3); transition: background var(--dur); }
        .meter[data-level="1"] i:nth-child(-n+1) { background: var(--bad); }
        .meter[data-level="2"] i:nth-child(-n+2) { background: var(--warn); }
        .meter[data-level="3"] i:nth-child(-n+3) { background: var(--info); }
        .meter[data-level="4"] i:nth-child(-n+4) { background: var(--ok); }
        .meter-txt { font-size: 12px; color: var(--text-3); display: flex; justify-content: space-between; }
        .meter-txt .caps { color: var(--warn); display: inline-flex; align-items: center; gap: 4px; }
        .meter-txt .caps .mi { font-size: 14px; }

        /* 确认框 */
        .check { display: flex; align-items: flex-start; gap: 9px; margin-top: 12px; padding: 11px 13px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-2); cursor: pointer; user-select: none; }
        .check input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
        .check span { font-size: 13.5px; font-weight: 600; }
        .check.shake { animation: shake .35s var(--ease); }
        @keyframes shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }

        .detail { margin-top: 9px; font-family: var(--mono); font-size: 12px; color: var(--text-3); word-break: break-all; }

        /* 操作条 */
        .actions { display: flex; align-items: center; gap: 8px; margin-top: 26px; }
        .actions .spacer { flex: 1; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; padding: 0 17px;
            border-radius: var(--r); border: 1px solid transparent; font-weight: 600; font-size: 14px; white-space: nowrap;
            transition: background var(--dur), color var(--dur), border-color var(--dur), opacity var(--dur);
        }
        .btn .mi { font-size: 18px; }
        .btn-primary { background: var(--accent); color: var(--accent-ink); }
        .btn-primary:hover { background: var(--accent-2); }
        .btn-primary:disabled { background: var(--surface-3); color: var(--text-3); cursor: not-allowed; }
        .btn-ghost { background: var(--surface); color: var(--text-2); border-color: var(--line-2); }
        .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
        .btn.loading { pointer-events: none; }
        .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 安装中 */
        .installing { padding: 8px 0; }
        .stage-lines { margin: 22px 0 0; }
        .stage-lines ul { margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
        .stage-lines li { list-style: none; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-3); transition: color var(--dur); }
        .stage-lines li .mi { font-size: 17px; }
        .stage-lines li.on { color: var(--text); font-weight: 600; }
        .stage-lines li.on .mi { color: var(--accent); }
        .stage-lines li.did { color: var(--text-2); }
        .stage-lines li.did .mi { color: var(--ok); }

        /* 完成 */
        .kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 18px; padding: 14px 16px; font-size: 14px; margin: 0; }
        .kv dt { color: var(--text-3); margin: 0; }
        .kv dd { margin: 0; font-weight: 600; word-break: break-all; }

        /* 提示气泡 */
        .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px); padding: 9px 15px; border-radius: var(--r); background: var(--text); color: var(--bg); font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: all var(--dur) var(--ease); z-index: 50; }
        .toast.show { opacity: 1; transform: translateX(-50%); }

        /* ================================================================
           响应式
           ================================================================ */
        @media (max-width: 720px) {
            .topbar { padding: 0 14px; }
            .stage { padding: 26px 14px 48px; }
            h1 { font-size: 22px; }
            .ext-grid { grid-template-columns: repeat(2, 1fr); }
            .steps { margin-bottom: 26px; }
            .step + .step::before { width: 14px; margin: 0 7px; }
            .step-title { display: none; }
            .step.active .step-title { display: block; }
        }
        @media (max-width: 520px) {
            .field.c4, .field.c3, .field.c2 { grid-column: span 6; }
            .actions { flex-wrap: wrap; }
            .actions .btn-primary { width: 100%; order: -1; }
            .actions .spacer { display: none; }
            .banner .aux { display: none; }
            .brand-name { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
<script type="application/json" id="boot">#{$boot}</script>

<header class="topbar">
    <div class="brand">
        <img src="/favicon.ico" alt="">
        <span class="brand-name" data-i18n="brand">异次元发卡</span>
        <span class="chip">v#{$version}</span>
    </div>
    <div class="tools">
        <div class="seg" role="group" aria-label="theme" id="theme-seg">
            <button type="button" data-pref="light" data-i18n-title="theme.light" title="浅色"><span class="mi material-icons-outlined">light_mode</span></button>
            <button type="button" data-pref="auto"  data-i18n-title="theme.auto"  title="跟随系统"><span class="mi material-icons-outlined">brightness_auto</span></button>
            <button type="button" data-pref="dark"  data-i18n-title="theme.dark"  title="深色"><span class="mi material-icons-outlined">dark_mode</span></button>
        </div>
        <div class="lang" id="lang">
            <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="menu" aria-expanded="false">
                <span class="mi material-icons-outlined">translate</span>
                <span id="lang-name">简体中文</span>
            </button>
            <div class="lang-menu hidden" id="lang-menu" role="menu"></div>
        </div>
    </div>
</header>

<main class="stage">
    <div class="panel">

    };
    var LANG_NAMES = {'zh-cn': '简体中文', 'zh-tw': '繁體中文', 'en': 'English', 'ja': '日本語'};
    var LANG_ORDER = ['zh-cn', 'zh-tw', 'en', 'ja'];

    var lang = pickLang();
    function pickLang() {
        var saved = null;
        try { saved = localStorage.getItem('acg-install-lang'); } catch (e) {}
        if (saved && I18N[saved]) return saved;
        if (BOOT.lang && I18N[BOOT.lang]) return BOOT.lang;
        var nav = ((navigator.languages || [navigator.language || ''])[0] || '').toLowerCase();
        if (nav.indexOf('zh') === 0) return /tw|hk|mo|hant/.test(nav) ? 'zh-tw' : 'zh-cn';
        if (nav.indexOf('ja') === 0) return 'ja';
        return 'en';
    }
    function t(key, vars) {
        var s = (I18N[lang] && I18N[lang][key]) || I18N['zh-cn'][key] || key;
        if (vars) s = s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] == null ? '' : String(vars[k]); });
        return s;
    }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
    /* 带 {x} 的文案用于 innerHTML 时：整句转义后再把占位替换成已转义的值 */
    function th(key, vars) {
        var s = esc((I18N[lang] && I18N[lang][key]) || I18N['zh-cn'][key] || key);
        if (vars) s = s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] == null ? '' : String(vars[k]); });
        return s;
    }

    function applyLang(code, persist, skipRender) {
        lang = I18N[code] ? code : 'zh-cn';
        document.documentElement.setAttribute('lang', t('html.lang'));
        document.title = t('title');
        document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
        document.querySelectorAll('[data-i18n-title]').forEach(function (el) { el.title = t(el.getAttribute('data-i18n-title')); });
        document.getElementById('lang-name').textContent = LANG_NAMES[lang];
        renderLangMenu();
        if (persist) {
            try { localStorage.setItem('acg-install-lang', lang); } catch (e) {}
            /* 同名 Cookie 是站点的语言开关：装完进后台直接就是这门语言 */
            document.cookie = 'acg_lang=' + lang + '; path=/; max-age=31536000; SameSite=Lax';
        }
        if (!skipRender) render(true);
    }
    function renderLangMenu() {
        var menu = document.getElementById('lang-menu');
        menu.innerHTML = LANG_ORDER.map(function (c) {
            return '<button type="button" role="menuitemradio" data-lang="' + c + '" aria-checked="' + (c === lang) + '"><span>' + LANG_NAMES[c] + '</span>' + (c === lang ? '<span class="mi material-icons-outlined">check</span>' : '') + '</button>';
        }).join('');
    }
    (function langMenu() {
        var btn = document.getElementById('lang-btn'), menu = document.getElementById('lang-menu'), wrap = document.getElementById('lang');
        function close() { menu.classList.add('hidden'); btn.setAttribute('aria-expanded', 'false'); }
        btn.addEventListener('click', function () {
            var open = menu.classList.toggle('hidden') === false;
            btn.setAttribute('aria-expanded', String(open));
        });
        menu.addEventListener('click', function (e) {
            var b = e.target.closest('[data-lang]');
            if (!b) return;
            close();
            applyLang(b.getAttribute('data-lang'), true);
        });
        document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) close(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();

       ================================================================ */
    (function theme() {
        var seg = document.getElementById('theme-seg');
        var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
        function apply(pref) {
            var dark = pref === 'dark' || (pref === 'auto' && mq && mq.matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme-pref', pref);
            seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-pref') === pref)); });
        }
        apply(document.documentElement.getAttribute('data-theme-pref') || 'auto');
        seg.addEventListener('click', function (e) {
            var b = e.target.closest('button');
            if (!b) return;
            var pref = b.getAttribute('data-pref');
            try { localStorage.setItem('admin-theme', pref); } catch (err) {}
            apply(pref);
        });
        if (mq && mq.addEventListener) mq.addEventListener('change', function () {
            if (document.documentElement.getAttribute('data-theme-pref') === 'auto') apply('auto');
        });
    })();

       状态
       ================================================================ */
    var env = BOOT.env || {};
    //官方镜像自带 MySQL：连接信息由服务端从环境变量注入，这里直接当默认值用。
    //密码**不在** prefill 里——提交时带 use_builtin=1，由服务端自己去取。
    var PRE = env.prefill || {};
    var hasBuiltin = !!PRE.host;
    var state = {
        step: 0,
        form: {
            host: PRE.host || (env.docker ? 'mysql' : '127.0.0.1'),
            port: String(PRE.port || 3306),
            database: PRE.database || '',
            username: PRE.username || '',
            password: '',
            prefix: PRE.prefix || 'acg_',
            email: '', nickname: '', login_password: '', login_re_password: ''
        },
        //只要用户没动过任何一项、密码也留空，就继续走"内置数据库"这条路
        builtin: hasBuiltin,
        dbResult: null,          // 最近一次测试结果
        dbTestedFor: '',         // 测试时的表单指纹，变了就作废
        overwriteOk: false,
        installError: null
    };
    try {
        var saved = JSON.parse(sessionStorage.getItem('acg-install-state') || 'null');
        if (saved && saved.form) {
            Object.keys(state.form).forEach(function (k) { if (typeof saved.form[k] === 'string') state.form[k] = saved.form[k]; });
            if (typeof saved.step === 'number' && saved.step > 0 && saved.step < 3 && env.install) state.step = saved.step;
        }
    } catch (e) {}
    function persist() {
        try { sessionStorage.setItem('acg-install-state', JSON.stringify({step: state.step, form: state.form})); } catch (e) {}
    }
    function dbFingerprint() {
        var f = state.form;
        return [f.host, f.port, f.database, f.username, f.password, f.prefix].join('');
    }

    var panel = document.getElementById('panel');
    var toastTimer = null;
    function toast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1600);
    }

    function post(url, data) {
        var body = new URLSearchParams();
        Object.keys(data).forEach(function (k) { body.append(k, data[k]); });
        return fetch(url, {method: 'POST', body: body, headers: {'X-Requested-With': 'XMLHttpRequest'}, credentials: 'same-origin'})
            .then(function (r) { return r.text(); })
            .then(function (txt) {
                try { return JSON.parse(txt); } catch (e) { throw new Error(t('err.server')); }
            });
    }

    function setStep(n) {
        state.step = n;
        persist();
        document.querySelectorAll('#steps .step').forEach(function (li) {
            var i = +li.getAttribute('data-step');
            li.classList.toggle('active', i === n);
            li.classList.toggle('done', i < n);
            var dot = li.querySelector('.step-dot');
            dot.innerHTML = i < n ? '<span class="mi material-icons-outlined">check</span>' : '<span class="n">' + (i + 1) + '</span>';
        });
        render();
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    /* 视图切换：换步骤时旧视图先淡出再换新内容；只是换语言重画同一步时直接替换，
       不然切一次语言整块内容就闪一下，还有 160ms 的空窗。 */
    var instantSwap = false;
    function swap(html, after) {
        var old = panel.firstElementChild;
        var go = function () {
            panel.innerHTML = '<div class="view">' + html + '</div>';
            if (after) after(panel.firstElementChild);
        };
        if (old && !instantSwap && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            old.classList.add('leaving');
            old.style.pointerEvents = 'none';   /* 淡出期间别再响应点击 */
            setTimeout(go, 160);
        } else {
            go();
        }
    }

    function render(instant) {
        stopPoll();
        instantSwap = !!instant;
        try {
            if (state.step === 0) renderEnv();
            else if (state.step === 1) renderDb();
            else if (state.step === 2) renderAdmin();
            else renderDone();
        } finally {
            instantSwap = false;
        }
    }

    /* ================================================================
       第 1 步：环境
       ================================================================ */
    var pollTimer = null;
    var POLL_S = 4;
    function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    function envIssues(e) {
        var n = 0;
        if (!(e.php && e.php.ok)) n++;
        n += (e.missing || []).length;
        n += (e.unwritable || []).length;
        return n;
    }

    function renderEnv() {
        stopPoll();   /* 从 recheck() 直接进来时也要先清掉旧计时器，否则每次状态变化都叠一个新的 setInterval */
        var e = env;
        var issues = envIssues(e);
        var ok = !!e.install;
        var extKeys = Object.keys(e.ext || {});
        var fsKeys = Object.keys(e.writable || {});
        var php = e.php || {};

        var html = '' +
            '<span class="eyebrow">' + esc(t('env.eyebrow')) + '</span>' +
            '<h1>' + esc(t('env.h1')) + '</h1>' +
            '<p class="lead">' + esc(t('env.lead')) + '</p>' +
            '<div class="banner ' + (ok ? 'ok' : 'warn') + '" id="env-banner">' +
                '<span class="mi material-icons-outlined">' + (ok ? 'verified' : 'error_outline') + '</span>' +
                '<div><b>' + (ok ? esc(t('env.ok.title')) : th('env.bad.title', {n: issues})) + '</b><p>' + esc(ok ? t('env.ok.desc') : t('env.bad.desc')) + '</p></div>' +
                (ok ? '' : '<span class="aux"><span class="spin" style="width:14px;height:14px;border-width:2px"></span>' + th('env.autopoll', {s: POLL_S}) + '</span>') +
            '</div>' +

            '<div class="card"><div class="card-h"><h3>' + esc(t('env.group.runtime')) + '</h3></div><div class="rows">' +
                '<div class="row"><span class="ico"><span class="mi material-icons-outlined">memory</span></span>' +
                    '<div class="grow"><div class="name">' + esc(t('env.php')) + ' <code>' + esc(php.version || '?') + '</code></div>' +
                    '<div class="sub">' + th('env.php.sub', {cur: php.version, min: php.min}) + '</div></div>' +
                    pill(php.ok, php.ok ? 'env.status.ok' : 'env.status.low') +
                '</div>' +
            '</div></div>' +

            '<div class="card"><div class="card-h"><h3>' + esc(t('env.group.ext')) + '</h3><span class="help">' + extKeys.filter(function (k) { return e.ext[k]; }).length + ' / ' + extKeys.length + '</span></div>' +
                '<div class="ext-grid">' + extKeys.map(function (k) {
                    return '<div class="ext ' + (e.ext[k] ? 'ok' : 'bad') + '"><span>' + esc(k) + '</span><span class="mi material-icons-outlined">' + (e.ext[k] ? 'check_circle' : 'cancel') + '</span></div>';
                }).join('') + '</div>' +
            '</div>' +

            '<div class="card"><div class="card-h"><h3>' + esc(t('env.group.fs')) + '</h3></div><div class="rows">' + fsKeys.map(function (k) {
                var w = e.writable[k];
                return '<div class="row"><span class="ico"><span class="mi material-icons-outlined">' + (w ? 'folder' : 'folder_off') + '</span></span>' +
                    '<div class="grow"><div class="name"><code>' + esc(k) + '/</code></div><div class="sub">' + esc(t('env.fs.' + k)) + '</div></div>' +
                    pill(w, w ? 'env.status.ok' : 'env.status.unwritable') + '</div>';
            }).join('') + '</div></div>' +

            (ok ? '' : renderFix(e)) +

            '<div class="actions">' +
                '<button type="button" class="btn btn-ghost" id="recheck"><span class="mi material-icons-outlined">refresh</span><span>' + esc(t('btn.recheck')) + '</span></button>' +
                '<span class="spacer"></span>' +
                '<button type="button" class="btn btn-primary" id="next" ' + (ok ? '' : 'disabled') + '><span>' + esc(t('btn.next')) + '</span><span class="mi material-icons-outlined">arrow_forward</span></button>' +
            '</div>';

        swap(html, function (view) {
            view.querySelector('#next').addEventListener('click', function () { if (env.install) setStep(1); });
            view.querySelector('#recheck').addEventListener('click', function () { recheck(true); });
            bindCopy(view);
            if (!ok) pollTimer = setInterval(function () { recheck(false); }, POLL_S * 1000);
        });
    }

    function pill(ok, key) {
        return '<span class="pill ' + (ok ? 'ok' : 'bad') + '"><span class="mi material-icons-outlined">' + (ok ? 'check' : 'close') + '</span>' + esc(t(key)) + '</span>';
    }

    function renderFix(e) {
        var items = [];
        var php = e.php || {};
        if (!php.ok) {
            items.push('<div class="fix-item"><b>' + esc(t('env.php')) + '</b><p>' + th('env.fix.php', {cur: php.version, min: php.min}) + '</p></div>');
        }
        var missing = e.missing || [];
        if (missing.length) {
            var apt = 'apt install ' + missing.map(function (m) { return 'php8.2-' + m.replace('pdo_mysql', 'mysql').replace('pdo', 'mysql'); }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(' ');
            var yum = 'yum install ' + missing.map(function (m) { return 'php-' + m.replace('pdo_mysql', 'mysqlnd').replace('pdo', 'pdo'); }).filter(function (v, i, a) { return a.indexOf(v) === i; }).join(' ');
            var dk = 'docker-php-ext-install ' + missing.join(' ');
            items.push('<div class="fix-item"><b>' + th('env.fix.ext', {list: missing.join(', ')}) + '</b>' +
                '<p>' + esc(t('env.fix.ext.bt')) + '</p>' +
                cmd(t('env.fix.ext.cli'), apt) + cmd('', yum) + cmd(t('env.fix.ext.docker'), dk) +
                '<p>' + esc(t('env.fix.ext.restart')) + '</p></div>');
        }
        var unw = e.unwritable || [];
        if (unw.length) {
            items.push('<div class="fix-item"><b>' + th('env.fix.fs', {list: unw.join(', ')}) + '</b><p>' + esc(t('env.fix.fs.desc')) + '</p>' +
                cmd('', 'chown -R www:www ' + '/path/to/site' + ' && chmod -R 755 ' + '/path/to/site') + '</div>');
        }
        return '<div class="card fix"><div class="card-h"><h3>' + esc(t('env.fix.title')) + '</h3></div><div class="fix-body">' + items.join('') + '</div></div>';
    }
    function cmd(label, text) {
        return '<div class="cmd">' + (label ? '<span class="k">' + esc(label) + '</span>' : '') + '<span class="txt">' + esc(text) + '</span>' +
            '<button type="button" class="copy" data-copy="' + esc(text) + '" title="' + esc(t('btn.copy')) + '"><span class="mi material-icons-outlined">content_copy</span></button></div>';
    }
    function bindCopy(view) {
        view.querySelectorAll('[data-copy]').forEach(function (b) {
            b.addEventListener('click', function () {
                var text = b.getAttribute('data-copy');
                var done = function () { toast(t('btn.copied')); };
                if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
                else { fallbackCopy(text); done(); }
            });
        });
    }
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    }

    var rechecking = false;
    function recheck(manual) {
        if (rechecking) return;
        rechecking = true;
        var btn = panel.querySelector('#recheck');
        if (manual && btn) { btn.classList.add('loading'); btn.innerHTML = '<span class="spin"></span><span>' + esc(t('btn.rechecking')) + '</span>'; }
        post('/install/env', {}).then(function (res) {
            if (res && res.code === 200 && res.data) {
                var before = env.install;
                env = res.data;
                if (state.step === 0) {
                    /* 状态变了才重绘，免得每 4 秒闪一下 */
                    if (manual || env.install !== before || envIssues(env) !== lastIssues) renderEnv();
                    lastIssues = envIssues(env);
                }
            } else if (manual) toast(t('err.server'));
        }).catch(function () { if (manual) toast(t('err.network')); }).then(function () { rechecking = false; });
    }
    var lastIssues = envIssues(env);

    /* ================================================================
       表单工具
       ================================================================ */
    function field(opt) {
        var tail = '';
        if (opt.password) tail = '<button type="button" class="tail" data-eye="' + opt.name + '" title="' + esc(t('pw.show')) + '"><span class="mi material-icons-outlined">visibility</span></button>';
        return '<div class="field ' + (opt.span || '') + '" data-field="' + opt.name + '">' +
            '<label class="label" for="f-' + opt.name + '"><span>' + esc(opt.label) + '</span>' + (opt.optional ? '<span class="opt">' + esc(t('optional')) + '</span>' : '') + '</label>' +
            '<div class="control' + (tail ? ' has-tail' : '') + '"><span class="mi material-icons-outlined lead-ico">' + opt.icon + '</span>' +
            '<input class="input" id="f-' + opt.name + '" name="' + opt.name + '" type="' + (opt.password ? 'password' : (opt.type || 'text')) + '" value="' + esc(opt.value || '') + '"' +
            ' autocomplete="' + (opt.autocomplete || 'off') + '" autocapitalize="off" autocorrect="off" spellcheck="false"' + (opt.inputmode ? ' inputmode="' + opt.inputmode + '"' : '') + (opt.placeholder ? ' placeholder="' + esc(opt.placeholder) + '"' : '') + '>' +
            tail + '</div>' +
            '<div class="help" data-help>' + esc(opt.help || '') + '</div>' + (opt.extra || '') +
            '</div>';
    }
    function bindForm(view, names, onChange) {
        names.forEach(function (n) {
            var input = view.querySelector('[name="' + n + '"]');
            if (!input) return;
            input.addEventListener('input', function () {
                state.form[n] = input.value;
                persist();
                clearInvalid(view, n);
                if (onChange) onChange(n, input.value);
            });
            input.addEventListener('blur', function () { validateField(view, n, true); });
        });
        view.querySelectorAll('[data-eye]').forEach(function (b) {
            b.addEventListener('click', function () {
                var input = view.querySelector('[name="' + b.getAttribute('data-eye') + '"]');
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                b.title = t(show ? 'pw.hide' : 'pw.show');
                b.querySelector('.mi').textContent = show ? 'visibility_off' : 'visibility';
                input.focus();
            });
        });
        view.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                e.preventDefault();
                var primary = view.querySelector('.btn-primary');
                if (primary && !primary.disabled) primary.click();
            }
        });
        var first = null;
        names.some(function (n) { var i = view.querySelector('[name="' + n + '"]'); if (i && !i.value) { first = i; return true; } return false; });
        (first || view.querySelector('[name="' + names[0] + '"]')).focus({preventScroll: true});
    }
    function setInvalid(view, name, msg) {
        var f = view.querySelector('[data-field="' + name + '"]');
        if (!f) return;
        f.classList.add('invalid'); f.classList.remove('ok');
        f.querySelector('[data-help]').textContent = msg;
        f.querySelector('input').setAttribute('aria-invalid', 'true');
    }
    function clearInvalid(view, name) {
        var f = view.querySelector('[data-field="' + name + '"]');
        if (!f || !f.classList.contains('invalid')) return;
        f.classList.remove('invalid');
        f.querySelector('[data-help]').textContent = f.getAttribute('data-help-default') || '';
        f.querySelector('input').removeAttribute('aria-invalid');
    }
    function rememberHelp(view) {
        view.querySelectorAll('.field').forEach(function (f) { f.setAttribute('data-help-default', f.querySelector('[data-help]').textContent); });
    }

    var RULES = {
        host: function (v) { return /^[A-Za-z0-9_\-.]{1,255}$/.test(v) ? '' : t('db.err.host'); },
        port: function (v) { return (/^\d{1,5}$/.test(v) && +v >= 1 && +v <= 65535) ? '' : t('db.err.port'); },
        database: function (v) { return /^[A-Za-z0-9_\-]{1,64}$/.test(v) ? '' : t('db.err.name'); },
        username: function (v) { return v.trim() ? '' : t('db.err.user'); },
        password: function () { return ''; },
        prefix: function (v) { return /^[A-Za-z0-9_]{0,32}$/.test(v) ? '' : t('db.err.prefix'); },
        email: function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? '' : t('admin.err.email'); },
        nickname: function (v) { return v.trim() ? '' : t('admin.err.nick'); },
        login_password: function (v) { return v.length >= 6 ? '' : t('admin.err.pass'); },
        login_re_password: function (v) { return v === state.form.login_password ? '' : t('admin.err.pass2'); }
    };
    function validateField(view, name, quiet) {
        var rule = RULES[name];
        if (!rule) return true;
        var msg = rule(state.form[name] || '');
        if (msg) { setInvalid(view, name, msg); return false; }
        clearInvalid(view, name);
        return true;
    }
    function validateAll(view, names) {
        var firstBad = null;
        names.forEach(function (n) { if (!validateField(view, n) && !firstBad) firstBad = n; });
        if (firstBad) view.querySelector('[name="' + firstBad + '"]').focus();
        return !firstBad;
    }

    /* ================================================================
       第 2 步：数据库
       ================================================================ */
    function renderDb() {
        var f = state.form;
        //内置数据库模式下把表单收起来：绝大多数人根本不需要看见它。
        var collapsed = state.builtin;
        var html = '' +
            '<span class="eyebrow">' + esc(t('db.eyebrow')) + '</span>' +
            '<h1>' + esc(t('db.h1')) + '</h1>' +
            '<p class="lead">' + esc(collapsed ? t('db.builtin.desc') : t('db.lead')) + '</p>' +
            (collapsed ? '<div style="margin-bottom:16px">' +
                banner('ok', 'check_circle', esc(t('db.builtin.title')),
                    '<code>' + esc(f.username) + '@' + esc(f.host) + ':' + esc(f.port) + '/' + esc(f.database) + '</code>') +
                '<button type="button" class="btn btn-ghost" id="manual" style="height:36px;margin-top:12px">' +
                '<span class="mi material-icons-outlined">tune</span><span>' + esc(t('db.builtin.manual')) + '</span></button>' +
                '</div>' : '') +
            '<form class="form" id="db-form" autocomplete="off" novalidate' + (collapsed ? ' hidden' : '') + '>' +
                field({name: 'host', label: t('db.host'), icon: 'dns', value: f.host, help: t(env.docker ? 'db.host.help.docker' : 'db.host.help'), span: 'c4'}) +
                field({name: 'port', label: t('db.port'), icon: 'tag', value: f.port, inputmode: 'numeric', span: 'c2'}) +
                field({name: 'database', label: t('db.name'), icon: 'storage', value: f.database, help: t('db.name.help'), placeholder: 'acg_faka'}) +
                field({name: 'username', label: t('db.user'), icon: 'person', value: f.username, span: 'c3'}) +
                field({name: 'password', label: t('db.pass'), icon: 'key', value: f.password, password: true, span: 'c3', autocomplete: 'new-password',
                    help: hasBuiltin ? t('db.builtin.pass') : ''}) +
                field({name: 'prefix', label: t('db.prefix'), icon: 'label', value: f.prefix, help: t('db.prefix.help'), optional: true}) +
            '</form>' +
            '<div id="db-result"></div>' +
            '<div class="actions">' +
                '<button type="button" class="btn btn-ghost" id="back"><span class="mi material-icons-outlined">arrow_back</span><span>' + esc(t('btn.back')) + '</span></button>' +
                '<span class="spacer"></span>' +
                '<button type="button" class="btn btn-ghost" id="test"><span class="mi material-icons-outlined">cable</span><span>' + esc(t('btn.test')) + '</span></button>' +
                '<button type="button" class="btn btn-primary" id="next"><span>' + esc(t('btn.next')) + '</span><span class="mi material-icons-outlined">arrow_forward</span></button>' +
            '</div>';

        swap(html, function (view) {
            rememberHelp(view);
            var names = ['host', 'port', 'database', 'username', 'password', 'prefix'];
            bindForm(view, names, function () {
                /* 改了任何一项，上次的测试结果就不作数了 */
                if (state.dbResult && dbFingerprint() !== state.dbTestedFor) {
                    state.dbResult = null; state.overwriteOk = false;
                    renderDbResult(view, {stale: true});
                }
            });
            if (state.dbResult && dbFingerprint() === state.dbTestedFor) renderDbResult(view, state.dbResult);

            //用户动了任何一项连接参数，就不再算"内置数据库"，改走他自己填的那套
            ['host', 'port', 'database', 'username', 'password', 'prefix'].forEach(function (n) {
                var i = view.querySelector('[name="' + n + '"]');
                if (i) i.addEventListener('input', function () { state.builtin = false; });
            });
            var manual = view.querySelector('#manual');
            if (manual) manual.addEventListener('click', function () {
                state.builtin = false;
                state.dbResult = null;
                renderDb();
            });

            //内置数据库：进来就自动测一次，用户看到绿灯直接点下一步
            if (state.builtin && !state.dbResult) {
                testDb(view, false);
            }

            view.querySelector('#back').addEventListener('click', function () { setStep(0); });
            view.querySelector('#test').addEventListener('click', function () { testDb(view, false); });
            view.querySelector('#next').addEventListener('click', function () {
                var r = state.dbResult;
                if (r && r.ok && dbFingerprint() === state.dbTestedFor) {
                    if (r.reason === 'version') return;
                    if (r.tables && r.tables.prefixed > 0 && !state.overwriteOk) {
                        var box = view.querySelector('#overwrite');
                        if (box) { box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); box.querySelector('input').focus(); }
                        return;
                    }
                    setStep(2);
                    return;
                }
                testDb(view, true);
            });
        });
    }

    function testDb(view, advance, create) {
        var names = ['host', 'port', 'database', 'username', 'password', 'prefix'];
        if (!validateAll(view, names)) return;
        var testBtn = view.querySelector('#test'), nextBtn = view.querySelector('#next');
        var label = create ? t('btn.creating') : t('btn.testing');
        testBtn.classList.add('loading'); testBtn.innerHTML = '<span class="spin"></span><span>' + esc(label) + '</span>';
        nextBtn.disabled = true;
        var fp = dbFingerprint();
        var data = {host: state.form.host, port: state.form.port, database: state.form.database, username: state.form.username, password: state.form.password, prefix: state.form.prefix};
        if (state.builtin) data.use_builtin = '1';
        if (create) data.create = '1';
        post('/install/testDatabase', data).then(function (res) {
            if (!res || res.code !== 200 || !res.data) throw new Error((res && res.msg) || t('err.server'));
            state.dbResult = res.data; state.dbTestedFor = fp; state.overwriteOk = false;
            renderDbResult(view, res.data);
            if (res.data.ok && res.data.reason === 'ok' && advance && !(res.data.tables && res.data.tables.prefixed > 0)) {
                setTimeout(function () { setStep(2); }, 350);
            }
        }).catch(function (err) {
            renderDbResult(view, {ok: false, reason: 'other', message: err && err.message});
        }).then(function () {
            testBtn.classList.remove('loading'); testBtn.innerHTML = '<span class="mi material-icons-outlined">cable</span><span>' + esc(t('btn.test')) + '</span>';
            nextBtn.disabled = false;
        });
    }

    function renderDbResult(view, r) {
        var box = view.querySelector('#db-result');
        if (!box) return;
        var f = state.form;
        var srv = r.server || {};
        var html = '';
        if (r.stale) {
            html = banner('info', 'info', esc(t('db.r.changed')), '');
        } else if (r.ok) {
            var over = r.tables && r.tables.prefixed > 0;
            if (r.reason === 'version') {
                html = banner('bad', 'error_outline', esc(t('db.r.version.title')), th('db.r.version.desc', {flavor: srv.flavor, version: srv.version, min: srv.min}));
            } else if (over) {
                html = banner('warn', 'warning_amber', th('db.r.overwrite.title', {n: r.tables.prefixed}), esc(t('db.r.overwrite.desc')) +
                    '<label class="check' + '" id="overwrite"><input type="checkbox"' + (state.overwriteOk ? ' checked' : '') + '><span>' + esc(t('db.r.overwrite.confirm')) + '</span></label>');
            } else {
                var desc = r.tables && r.tables.total > 0 ? th('db.r.ok.coexist', {flavor: srv.flavor, version: srv.version, total: r.tables.total}) : th('db.r.ok.empty', {flavor: srv.flavor, version: srv.version});
                if (r.created) desc += '<br>' + th('db.r.created', {db: f.database});
                html = banner('ok', 'check_circle', esc(t('db.r.ok.title')), desc);
            }
        } else {
            switch (r.reason) {
                case 'connect': html = banner('bad', 'wifi_off', th('db.r.connect.title', {host: f.host, port: f.port}), esc(t('db.r.connect.desc')) + detail(r.message)); break;
                case 'auth': html = banner('bad', 'lock', esc(t('db.r.auth.title')), esc(t('db.r.auth.desc')) + detail(r.message)); break;
                case 'unknown_db': html = banner('info', 'help_outline', th('db.r.unknown.title', {db: f.database}), esc(t('db.r.unknown.desc')) +
                    '<div style="margin-top:12px"><button type="button" class="btn btn-primary" id="create-db" style="height:40px"><span class="mi material-icons-outlined">add_circle_outline</span><span>' + esc(t('btn.create')) + '</span></button></div>'); break;
                case 'create_denied': html = banner('bad', 'block', esc(t('db.r.denied.title')), th('db.r.denied.desc', {db: f.database}) + detail(r.message)); break;
                case 'invalid': html = banner('bad', 'error_outline', esc(t('db.r.invalid')), ''); if (r.field) setInvalid(view, r.field, RULES[r.field] ? RULES[r.field](state.form[r.field] || '') || t('db.r.invalid') : t('db.r.invalid')); break;
                default: html = banner('bad', 'error_outline', esc(t('db.r.other.title')), detail(r.message));
            }
        }
        box.innerHTML = html ? '<div class="view" style="margin-top:18px">' + html + '</div>' : '';
        var ov = box.querySelector('#overwrite input');
        if (ov) ov.addEventListener('change', function () { state.overwriteOk = ov.checked; });
        var cb = box.querySelector('#create-db');
        if (cb) cb.addEventListener('click', function () { testDb(view, false, true); });
    }
    function banner(kind, icon, title, body) {
        return '<div class="banner ' + kind + '" style="margin-bottom:0"><span class="mi material-icons-outlined">' + icon + '</span><div style="flex:1;min-width:0"><b>' + title + '</b>' + (body ? '<p>' + body + '</p>' : '') + '</div></div>';
    }
    function detail(msg) {
        return msg ? '<div class="detail">' + esc(t('db.r.detail')) + ' ' + esc(msg) + '</div>' : '';
    }

    /* ================================================================
       第 3 步：管理员
       ================================================================ */
    function renderAdmin() {
        var f = state.form;
        var html = '' +
            '<span class="eyebrow">' + esc(t('admin.eyebrow')) + '</span>' +
            '<h1>' + esc(t('admin.h1')) + '</h1>' +
            '<p class="lead">' + esc(t('admin.lead')) + '</p>' +
            '<form class="form" id="admin-form" autocomplete="off" novalidate>' +
                field({name: 'email', label: t('admin.email'), icon: 'alternate_email', value: f.email, type: 'email', help: t('admin.email.help'), autocomplete: 'username', span: 'c3'}) +
                field({name: 'nickname', label: t('admin.nick'), icon: 'badge', value: f.nickname, help: t('admin.nick.help'), span: 'c3'}) +
                field({name: 'login_password', label: t('admin.pass'), icon: 'password', value: f.login_password, password: true, help: t('admin.pass.help'), autocomplete: 'new-password',
                    extra: '<div class="meter" id="meter" data-level="0"><i></i><i></i><i></i><i></i></div><div class="meter-txt"><span id="meter-txt"></span><span class="caps hidden" id="caps"><span class="mi material-icons-outlined">keyboard_capslock</span>' + esc(t('pw.caps')) + '</span></div>'}) +
                field({name: 'login_re_password', label: t('admin.pass2'), icon: 'done_all', value: f.login_re_password, password: true, autocomplete: 'new-password'}) +
            '</form>' +
            '<div class="actions">' +
                '<button type="button" class="btn btn-ghost" id="back"><span class="mi material-icons-outlined">arrow_back</span><span>' + esc(t('btn.back')) + '</span></button>' +
                '<span class="spacer"></span>' +
                '<button type="button" class="btn btn-primary" id="install"><span class="mi material-icons-outlined">rocket_launch</span><span>' + esc(t('btn.install')) + '</span></button>' +
            '</div>';

        swap(html, function (view) {
            rememberHelp(view);
            var names = ['email', 'nickname', 'login_password', 'login_re_password'];
            bindForm(view, names, function (n) {
                if (n === 'login_password') { meter(view); if (state.form.login_re_password) matchHint(view); }
                if (n === 'login_re_password') matchHint(view);
            });
            meter(view);
            view.querySelectorAll('input[type="password"]').forEach(function (i) {
                i.addEventListener('keyup', function (e) {
                    var on = e.getModifierState && e.getModifierState('CapsLock');
                    view.querySelector('#caps').classList.toggle('hidden', !on);
                });
            });
            view.querySelector('#back').addEventListener('click', function () { setStep(1); });
            view.querySelector('#install').addEventListener('click', function () {
                if (!validateAll(view, names)) return;
                install();
            });
        });
    }
    function strength(p) {
        if (!p) return 0;
        var s = 0;
        if (p.length >= 6) s++;
        if (p.length >= 10) s++;
        if (/[a-z]/.test(p) && /[A-Z]/.test(p)) s++;
        if (/\d/.test(p)) s++;
        if (/[^A-Za-z0-9]/.test(p)) s++;
        return Math.max(1, Math.min(4, Math.round(s * 4 / 5)));
    }
    function meter(view) {
        var p = state.form.login_password;
        var lv = strength(p);
        view.querySelector('#meter').setAttribute('data-level', String(p ? lv : 0));
        view.querySelector('#meter-txt').textContent = p ? t(['', 'pw.weak', 'pw.fair', 'pw.good', 'pw.strong'][lv]) : '';
    }
    function matchHint(view) {
        var f = view.querySelector('[data-field="login_re_password"]');
        var same = state.form.login_re_password && state.form.login_re_password === state.form.login_password;
        f.classList.toggle('ok', !!same);
        if (same) { clearInvalid(view, 'login_re_password'); f.querySelector('[data-help]').textContent = t('pw.match'); }
        else f.querySelector('[data-help]').textContent = '';
    }

    /* ================================================================
       安装
       ================================================================ */
    function install() {
        var lines = ['inst.s1', 'inst.s2', 'inst.s3', 'inst.s4', 'inst.s5'];
        var html = '<div class="installing">' +
            '<h1 style="margin:0 0 6px">' + esc(t('inst.title')) + '</h1>' +
            '<p class="lead" style="margin-bottom:0">' + esc(t('inst.note')) + '</p>' +
            '<div class="stage-lines"><ul>' + lines.map(function (k, i) { return '<li data-i="' + i + '"><span class="mi material-icons-outlined">radio_button_unchecked</span><span>' + esc(t(k)) + '</span></li>'; }).join('') + '</ul></div>' +
            '</div>';
        swap(html, function (view) {
            /* 服务端是一次调用做完全部工作，这里只是按它实际的执行顺序逐行点亮，不编百分比 */
            var i = 0, items = view.querySelectorAll('.stage-lines li');
            var tick = function () {
                if (i > 0) { items[i - 1].classList.remove('on'); items[i - 1].classList.add('did'); items[i - 1].querySelector('.mi').textContent = 'check_circle'; }
                if (i < items.length) { items[i].classList.add('on'); items[i].querySelector('.mi').textContent = 'radio_button_checked'; i++; }
            };
            tick();
            var timer = setInterval(function () { if (i < items.length - 1) tick(); }, 900);
            var f = state.form;
            var started = Date.now();
            var payload = {host: f.host, port: f.port, database: f.database, username: f.username, password: f.password, prefix: f.prefix, email: f.email, nickname: f.nickname, login_password: f.login_password};
            if (state.builtin) payload.use_builtin = '1';
            post('/install/submit', payload)
                .then(function (res) {
                    clearInterval(timer);
                    if (res && res.code === 200) {
                        while (i < items.length) tick();
                        tick();
                        try { sessionStorage.removeItem('acg-install-state'); } catch (e) {}
                        setTimeout(function () { setStep(3); }, Math.max(0, 900 - (Date.now() - started)));
                    } else {
                        state.installError = translateServerError(res && res.msg);
                        renderInstallError();
                    }
                })
                .catch(function (err) {
                    clearInterval(timer);
                    state.installError = (err && err.message) || t('err.network');
                    renderInstallError();
                });
        });
    }
    function translateServerError(msg) {
        msg = String(msg || '');
        if (!msg) return t('err.server');
        if (msg.indexOf('邮箱格式') >= 0) return t('admin.err.email');
        if (msg.indexOf('过于简单') >= 0) return t('admin.err.pass');
        if (msg.indexOf('昵称') >= 0) return t('admin.err.nick');
        if (msg.indexOf('没有写入权限') >= 0) return t('err.write');
        if (msg.indexOf('已经安装') >= 0 || msg === '已安装') return t('err.installed');
        if (msg.indexOf('数据库出错') === 0) return t('err.db', {msg: msg.replace(/^数据库出错[，,]?原因[：:]?\s*/, '')});
        return msg;
    }
    function renderInstallError() {
        var html = '<span class="eyebrow">' + esc(t('admin.eyebrow')) + '</span>' +
            '<h1>' + esc(t('inst.err.title')) + '</h1>' +
            '<p class="lead">' + esc(t('inst.err.desc')) + '</p>' +
            banner('bad', 'error_outline', esc(state.installError), '') +
            '<div class="actions"><span class="spacer"></span><button type="button" class="btn btn-primary" id="retry"><span class="mi material-icons-outlined">arrow_back</span><span>' + esc(t('btn.retry')) + '</span></button></div>';
        swap(html, function (view) {
            view.querySelector('#retry').addEventListener('click', function () { setStep(2); });
        });
    }

    /* ================================================================
       完成
       ================================================================ */
    function renderDone() {
        var adminUrl = location.origin + '/admin';
        var html = '' +
            '<span class="eyebrow">' + esc(t('done.eyebrow')) + '</span>' +
            '<h1>' + esc(t('done.h1')) + '</h1>' +
            '<p class="lead">' + esc(t('done.lead')) + '</p>' +
            '<div class="card"><dl class="kv">' +
                '<dt>' + esc(t('done.admin')) + '</dt><dd><code>' + esc(adminUrl) + '</code></dd>' +
                '<dt>' + esc(t('done.account')) + '</dt><dd>' + esc(state.form.email) + '</dd>' +
            '</dl></div>' +
            '<p class="help" style="margin:14px 0 0">' + esc(t('done.tip')) + '</p>' +
            '<div class="actions">' +
                '<a class="btn btn-ghost" href="/"><span class="mi material-icons-outlined">storefront</span><span>' + esc(t('btn.home')) + '</span></a>' +
                '<span class="spacer"></span>' +
                '<a class="btn btn-primary" href="/admin/authentication/login" id="go-admin"><span class="mi material-icons-outlined">admin_panel_settings</span><span>' + esc(t('btn.admin')) + '</span></a>' +
            '</div>';
        swap(html, function (view) { view.querySelector('#go-admin').focus({preventScroll: true}); });
    }

    /* ================================================================
       启动
       ================================================================ */
    applyLang(lang, false, true);   /* 只翻译静态文案；视图由下面的 setStep 首次渲染，避免开屏画两遍 */
    setStep(state.step);
})();
</script>
</body>
</html>
